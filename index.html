<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF6EF;--card:#fff;--ink:#2E2A3B;--soft:#6E6880;--line:#ECE4D8;--violet:#7B6CF6;--violet-l:#EEEBFF;--mint:#2FB38A;--mint-l:#E3F6EF;--coral:#F2785C;--coral-l:#FDEBE5;--sun:#F4B740;--sun-l:#FFF4DB;--sky:#4BA3E3;--sky-l:#E4F2FC;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Lexend',system-ui,sans-serif;font-size:17px;line-height:1.5}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hd{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{font-weight:700;font-size:20px;flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.logo .mark{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#6D4AFF,#E94BA8);font-size:17px}
.logo .brand{font-weight:700;letter-spacing:-.5px;background:linear-gradient(90deg,#6D4AFF,#E94BA8);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{font-weight:500;font-size:14px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-size:15px}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:999px;width:40px;height:40px;font-size:18px;flex:none}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nv{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nv button{background:none;padding:9px 0 11px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--soft);font-weight:500;font-size:13px;position:relative}
.nv button span{font-size:25px;line-height:1}
.nv button.on{color:var(--violet)}
.nv .dot{position:absolute;top:6px;left:calc(50% + 8px);background:var(--coral);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;font-weight:700}
h1{font-size:24px;margin:18px 0 6px} h2{font-size:19px;margin:0 0 10px}
.sub{color:var(--soft);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0}
.btn{background:var(--violet);color:#fff;border-radius:14px;padding:13px 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px}
.btn.full{width:100%} .btn.ghost{background:var(--violet-l);color:var(--violet)} .btn.mint{background:var(--mint)} .btn.coral{background:var(--coral)} .btn.light{background:#F3EFE8;color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap} .row>.btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{background:#F3EFE8;border-radius:999px;padding:9px 14px;font-weight:500;font-size:15px}
.chip.on{background:var(--violet);color:#fff}
textarea,input[type=text],input[type=date],select{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--violet)}
label.l{display:block;font-weight:600;margin:12px 0 6px}
.banner{border-radius:var(--r);padding:14px 16px;margin:14px 0;display:flex;gap:12px;align-items:flex-start}
.banner.sun{background:var(--sun-l)}.banner.sky{background:var(--sky-l)}.banner.coral{background:var(--coral-l)}.banner.mint{background:var(--mint-l)}.banner.violet{background:var(--violet-l)}
.banner .ic{font-size:24px;line-height:1.2}
.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0}
.av{font-size:28px;background:#F3EFE8;border-radius:14px;padding:6px 0;border:2px solid transparent}
.av.on{border-color:var(--violet);background:var(--violet-l)}
.check{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:15px}
.check input{width:22px;height:22px;flex:none;margin-top:2px}
.rank{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.rank:first-child{border-top:none}
.rank .n{width:28px;text-align:center;font-weight:700;color:var(--soft)}
.rank .a{font-size:26px;position:relative}
.rank .a i{position:absolute;right:-2px;bottom:2px;width:10px;height:10px;border-radius:50%;background:var(--mint);border:2px solid #fff}
.rank .p{flex:1;font-weight:500}
.rank .s{font-weight:700}
.empty{color:var(--soft);text-align:center;padding:16px 0}
.center{text-align:center}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.msg{max-width:84%;padding:9px 13px;border-radius:18px;word-wrap:break-word;position:relative}
.msg.them{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:6px}
.msg.me{background:var(--violet);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.msg .w{font-size:13px;font-weight:600;color:var(--violet)}
.msg .t{font-size:11px;opacity:.6;margin-left:6px}
.msg .flag{background:none;font-size:13px;opacity:.5;padding:0 0 0 6px}
.composer{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));background:var(--bg);padding:8px 0}
.composer .in{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:50px;max-height:140px}
.send{background:var(--violet);color:#fff;border-radius:14px;width:54px;height:50px;font-size:22px;flex:none}
.reacts{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto}
.reacts button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:18px;flex:none}
/* défi */
.qbar{height:10px;background:#F3EFE8;border-radius:5px;overflow:hidden;margin:10px 0}
.qbar i{display:block;height:100%;background:var(--violet);transition:width .25s linear}
.qtext{font-size:22px;font-weight:600;text-align:center;margin:18px 0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{color:#fff;border-radius:16px;padding:18px 12px;min-height:90px;font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px;text-align:left}
.ans .sh{font-size:22px;flex:none}
.ans.c0{background:#E8566B}.ans.c1{background:#3D8FD9}.ans.c2{background:#E8A42C}.ans.c3{background:#2FA77F}
.ans.dim{opacity:.35}.ans.pick{outline:4px solid var(--ink);outline-offset:2px}
.ans.good{opacity:1;outline:4px solid var(--mint);outline-offset:2px}
.big{font-size:44px;text-align:center;margin:6px 0}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:20px 0}
.podium div{text-align:center;flex:1;max-width:120px}
.podium .blk{border-radius:12px 12px 0 0;color:#fff;font-weight:700;font-size:22px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px}
/* quiz */
.qopt{display:block;width:100%;text-align:left;background:#F7F3EC;border:2px solid transparent;border-radius:14px;padding:12px 14px;margin:8px 0;font-weight:500}
.qopt.ok{background:var(--mint-l);border-color:var(--mint)} .qopt.ko{background:var(--coral-l);border-color:var(--coral)}
.expl{font-size:15px;color:var(--soft);margin:6px 0 12px}
.qitem{padding:12px 0;border-top:1px solid var(--line)} .qitem:first-child{border-top:none}
.meta{font-size:14px;color:var(--soft)}
.mini{background:none;color:var(--violet);font-weight:600;font-size:14px;padding:4px 0}
.tag{display:inline-block;border-radius:8px;padding:1px 8px;font-size:13px;font-weight:600;margin-right:6px}
/* agenda */
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)} .task:first-child{border-top:none}
.cb{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);background:#fff;flex:none;color:#fff;font-size:16px}
.cb.on{background:var(--mint);border-color:var(--mint)}
.task .x{flex:1} .task.done .txt{text-decoration:line-through;color:var(--soft)}
.tbig{font-size:52px;font-weight:700;text-align:center;margin:4px 0}
/* modal */
.ov{position:fixed;inset:0;background:rgba(46,42,59,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(30px + env(safe-area-inset-bottom))}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:24px}}
.sheet .xb{float:right;background:#F3EFE8;border-radius:999px;width:36px;height:36px;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:60;font-size:15px;max-width:90%;text-align:center}
.codebox{font-size:34px;font-weight:700;letter-spacing:6px;text-align:center;background:var(--violet-l);color:var(--violet);border-radius:16px;padding:12px;margin:10px 0}
.dots span{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--soft);margin-right:4px;animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.25}50%{opacity:1}}
.confetti{position:fixed;top:-20px;font-size:24px;z-index:70;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<header><div class="hd">
  <div class="logo"><span class="mark">⚡</span><span class="brand">Révizz</span> <small id="gname" onclick="openGroups()" style="cursor:pointer"></small></div>

</div></nav>

<script>
/* ===== configuration du serveur ===== */
const API_URL = 'https://fbhhdyamgltswycweuea.supabase.co';
const API_KEY = 'sb_publishable_xe-1hVpfX1IAT0RtALPY2g_tzGI-LGn';

/* ===== utilitaires ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const z=n=>String(n).padStart(2,'0');
const dayStr=(d=new Date())=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const addDays=(s,n)=>{const[y,m,d]=s.split('-').map(Number);return dayStr(new Date(y,m-1,d+n));};
function frDate(s){const t=dayStr();if(s===t)return"aujourd'hui";if(s===addDays(t,1))return'demain';if(s===addDays(t,-1))return'hier';const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});}
const hhmm=iso=>{const d=new Date(iso);return z(d.getHours())+':'+z(d.getMinutes());};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(t,ms=2800){document.querySelectorAll('.toast').forEach(e=>e.remove());const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),ms);}
const LS={get(k,d){try{const v=localStorage.getItem('hd_'+k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem('hd_'+k,JSON.stringify(v));}catch(e){}}};
function confetti(){const e=['🎉','⭐','✨','🎊','💜','🏆'];for(let i=0;i<28;i++){const c=document.createElement('div');c.className='confetti';c.textContent=e[i%e.length];c.style.left=Math.random()*100+'vw';c.style.animationDuration=(2+Math.random()*2)+'s';c.style.animationDelay=(Math.random()*.6)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),5000);}}

const MATIERES=[
 {id:'francais',n:'Français',e:'📖',c:'#F2785C'},{id:'maths',n:'Maths',e:'🔢',c:'#7B6CF6'},{id:'anglais',n:'Anglais',e:'🇬🇧',c:'#4BA3E3'},
 {id:'qlm',n:'Questionner le monde',e:'🔍',c:'#2FB38A'},{id:'sciences',n:'Sciences',e:'🔬',c:'#2FB38A'},
 {id:'histgeo',n:'Histoire-Géo',e:'🌍',c:'#C98A2B'},{id:'svt',n:'SVT',e:'🌱',c:'#2FB38A'},{id:'physique',n:'Physique-Chimie',e:'⚗️',c:'#9A5BD6'},
 {id:'techno',n:'Techno',e:'⚙️',c:'#5B7A8C'},{id:'langue2',n:'LV2',e:'💬',c:'#E0567A'},{id:'ses',n:'SES',e:'📈',c:'#D9822B'},
 {id:'snt',n:'SNT',e:'💻',c:'#3D7FD9'},{id:'ensci',n:'Ens. scientifique',e:'🧪',c:'#2FA7A0'},{id:'specialite',n:'Spécialité',e:'🎯',c:'#B0478F'},
 {id:'philo',n:'Philo',e:'🤔',c:'#6B5B95'},{id:'emc',n:'EMC',e:'🤝',c:'#8C6B5B'},{id:'autre',n:'Culture G',e:'✨',c:'#6E6880'}];
const NIVEAUX=[{cycle:'Primaire',l:['CP','CE1','CE2','CM1','CM2']},{cycle:'Collège',l:['6e','5e','4e','3e']},{cycle:'Lycée',l:['2nde','1re','Tle']}];
const NIV_LABEL={CP:'CP',CE1:'CE1',CE2:'CE2',CM1:'CM1',CM2:'CM2','6e':'6e','5e':'5e','4e':'4e','3e':'3e','2nde':'Seconde','1re':'Première',Tle:'Terminale'};
const MATS_PAR_NIVEAU={
  CP:['francais','maths','qlm','anglais','emc','autre'],CE1:['francais','maths','qlm','anglais','emc','autre'],CE2:['francais','maths','qlm','anglais','emc','autre'],
  CM1:['francais','maths','sciences','histgeo','anglais','emc','autre'],CM2:['francais','maths','sciences','histgeo','anglais','emc','autre'],
  '6e':['francais','maths','anglais','histgeo','svt','physique','techno','emc','autre'],
  '5e':['francais','maths','anglais','langue2','histgeo','svt','physique','techno','emc','autre'],
  '4e':['francais','maths','anglais','langue2','histgeo','svt','physique','techno','emc','autre'],
  '3e':['francais','maths','anglais','langue2','histgeo','svt','physique','techno','emc','autre'],
  '2nde':['francais','maths','anglais','langue2','histgeo','svt','physique','ses','snt','emc','autre'],
  '1re':['francais','maths','anglais','langue2','histgeo','ensci','specialite','svt','physique','ses','emc','autre'],
  Tle:['philo','maths','anglais','langue2','histgeo','ensci','specialite','svt','physique','ses','emc','autre']};
const estPrimaire=n=>['CP','CE1','CE2','CM1','CM2'].includes(n);
function NIV(){return (GS&&GS.groupe&&GS.groupe.niveau)||(G&&G.niveau)||'5e';}
function MATS(){return (MATS_PAR_NIVEAU[NIV()]||MATS_PAR_NIVEAU['5e']).map(M);}
function M(id){return MATIERES.find(m=>m.id===id)||MATIERES[MATIERES.length-1];}
const tag=id=>{const m=M(id);return `<span class="tag" style="background:${m.c}22;color:${m.c}">${m.e} ${esc(m.n)}</span>`;};
const AVATARS=['😎','🔥','⚡','💎','👑','🎧','🎮','🛹','🏀','⚽','🎤','📸','🎨','🌙','🌈','🦋','🐺','🍕'];

/* ===== serveur ===== */
const ERR={
  acces_refuse:"Ton accès à ce groupe n'est plus valide.",exclu:"Tu as été retiré de ce groupe par son administrateur.",
  mot_blessant:"Ce texte contient un mot qui peut blesser. Reformule gentiment 💜",
  info_perso:"Pour ta sécurité : pas de numéro, d'adresse, d'e-mail ni de réseau social ici.",
  lien:"Les liens ne sont pas autorisés.",trop_vite:"Doucement 😄 attends quelques secondes.",trop_long:"Message trop long (300 caractères max).",vide:"Le message est vide.",
  pseudo_pris:"Ce pseudo est déjà pris dans ce groupe.",pseudo_invalide:"Ton pseudo doit faire entre 2 et 20 caractères.",nom_invalide:"Le nom du groupe doit faire entre 1 et 40 caractères.",
  code_inconnu:"Ce code de groupe n'existe pas. Vérifie-le !",groupe_plein:"Ce groupe est complet (40 personnes).",
  pas_assez_questions:"Pas encore assez de questions pour cette matière (3 minimum). De nouvelles questions ⚡ Révizz arrivent chaque nuit !",
  defi_en_cours:"Un défi est déjà en cours dans le groupe : rejoins-le !",trop_tard:"Trop tard pour cette question ⏱",pas_createur:"Seul le créateur du défi peut le lancer.",pas_admin:"Réservé à l'administrateur du groupe.",
  trop_de_questions:"Tu as ajouté beaucoup de questions aujourd'hui, reviens demain !",question_invalide:"La question est trop courte.",choix_invalides:"Vérifie les réponses (2 à 4, 80 caractères max).",
  introuvable:"Introuvable (déjà supprimé ?).",code_transfert_invalide:"Ce code n'est pas bon ou il a expiré. Demande-en un nouveau sur l'ancien téléphone.",pas_assez_joueurs:"Il faut au moins 2 joueurs pour lancer le défi.",defi_commence:"Ce défi a déjà commencé : tu pourras participer au prochain !",pas_createur_annuler:"Seul le créateur du défi peut l'annuler.",code_creation_invalide:"Ce code de création n'est pas le bon. Demande-le à un parent 🔐",creation_fermee:"La création de groupes est fermée pour le moment.",trop_de_tentatives:"Beaucoup de groupes viennent d'être créés. Réessaie un peu plus tard.",niveau_invalide:"Choisis un niveau.",niveau_definitif:"Le niveau du groupe est déjà choisi : il ne peut plus être changé.",mise_a_jour_requise:"Recharge l'appli pour avoir la dernière version.",reseau:"Pas de connexion internet 📶 Réessaie."};
const errMsg=e=>ERR[e&&e.code]||"Oups, une erreur s'est produite. Réessaie.";
async function rpc(fn,args){
  let r;
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),12000);
  try{r=await fetch(API_URL+'/rest/v1/rpc/'+fn,{signal:ctl.signal,method:'POST',headers:Object.assign({'Content-Type':'application/json','apikey':API_KEY},API_KEY.startsWith('sb_')?{}:{'Authorization':'Bearer '+API_KEY}),body:JSON.stringify(args)});}
  catch(e){clearTimeout(tm);throw{code:'reseau'};}
  clearTimeout(tm);
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null;}catch(e){}
  if(!r.ok)throw{code:(j&&j.message)||'erreur'};
  return j;
}
function call(fn,extra){if(!G)throw{code:'acces_refuse'};return rpc(fn,Object.assign({p_membre:G.membre_id,p_token:G.token},extra||{})).catch(e=>{if(e.code==='acces_refuse'||e.code==='exclu'){toast(errMsg(e),5000);leaveLocal();}throw e;});}
function newToken(){const a=new Uint8Array(24);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');}

/* ===== état ===== */
let P=LS.get('profil',null);         // {pseudo, avatar}
let GROUPS=LS.get('groupes',null);  // [{membre_id, token, groupe_id, code, nom, seen}]
if(!GROUPS){const old=LS.get('groupe',null);GROUPS=old?[old]:[];}
let G=GROUPS.find(g=>g.membre_id===LS.get('courant',null))||GROUPS[0]||null;
let JOINING=false;
let CN=null;                         // niveau choisi à la création                   // écran « rejoindre / créer » ouvert alors qu'on a déjà un groupe
const MAX_GROUPES=6;
function saveGroups(){LS.set('groupes',GROUPS);LS.set('courant',G?G.membre_id:null);}
let AG=LS.get('agenda',{items:[]});
let BLOQ=LS.get('bloques',[]);

let MSGS=[],lastMsg=0,seenMsg=G?(G.seen||0):0;
let TAB='defis';
function resetGroupState(){DJL=null;DJLt=0;DJ=null;GS=null;MSGS=[];lastMsg=0;seenMsg=G?(G.seen||0):0;if(DF)clearTimeout(DF.loop);DF=null;FI={list:null,niv:null,mat:null,id:null};}
function leaveLocal(){const id=G&&G.membre_id;GROUPS=GROUPS.filter(g=>g.membre_id!==id);G=GROUPS[0]||null;saveGroups();resetGroupState();TAB='defis';go('defis');}
function switchGroup(mid){const g=GROUPS.find(x=>x.membre_id===mid);if(!g)return;G=g;JOINING=false;saveGroups();resetGroupState();closeModal();TAB='defis';go('defis');poll();}

  if(!P||!P.ok)return;

async function joinGroup(){
  const code=$('#jCode').value.trim().toUpperCase();if(code.length!==6){toast('Le code fait 6 caractères');return;}
  if(GROUPS.length>=MAX_GROUPES){toast('Maximum '+MAX_GROUPES+' groupes');return;}
  if(GROUPS.some(g=>g.code===code)){toast('Tu es déjà dans ce groupe 😉');const g=GROUPS.find(g=>g.code===code);switchGroup(g.membre_id);return;}
  const token=newToken();
  try{const r=await rpc('rejoindre_groupe',{p_code:code,p_pseudo:P.pseudo,p_avatar:P.avatar,p_token:token});setGroup(r,token);toast('Bienvenue dans « '+r.nom+' » 🎉');}
  catch(e){toast(errMsg(e),4000);}
}
async function createGroup(){
  const nom=$('#cNom').value.trim();if(!nom){toast('Donne un nom à ton groupe');return;}
  if(!CN){toast('Choisis le niveau du groupe');return;}
  if(GROUPS.length>=MAX_GROUPES){toast('Maximum '+MAX_GROUPES+' groupes');return;}
  const token=newToken();
  try{const r=await rpc('creer_groupe',{p_nom:nom,p_pseudo:P.pseudo,p_avatar:P.avatar,p_token:token,p_code_creation:null,p_niveau:CN});if(r&&r.erreur)throw{code:r.erreur};setGroup(r,token);openInvite();}
  catch(e){toast(errMsg(e),4000);}
}
function setGroup(r,token){
  G={membre_id:r.membre_id,token,groupe_id:r.groupe_id,code:r.code,nom:r.nom,niveau:r.niveau||null,seen:0};CN=null;GROUPS.push(G);JOINING=false;saveGroups();
  resetGroupState();
  if(location.search)history.replaceState(null,'',location.pathname);
  TAB='defis';go('defis');poll();
}
function inviteLink(){return location.origin+location.pathname+'?code='+G.code;}

  <div class="codebox">${esc(G.code)}</div>

}

/* ===== synchro ===== */
let pollT=null,polling=false;
async function poll(){
  clearTimeout(pollT);
  if(!G||document.hidden){pollT=setTimeout(poll,4000);return;}
  if(!polling){polling=true;
    try{
      const g0=G;const s=await call('etat_groupe',{p_depuis:lastMsg});
      if(s&&G===g0){GS=s;
        if(s.groupe&&(s.groupe.nom!==G.nom||s.groupe.code!==G.code||s.groupe.niveau!==G.niveau)){G.nom=s.groupe.nom;G.code=s.groupe.code;G.niveau=s.groupe.niveau;saveGroups();render();}
        const masq=new Set(s.masques||[]);
        const nouveaux=(s.messages||[]).filter(m=>m.id>lastMsg);
        MSGS=MSGS.concat(nouveaux).filter(m=>!masq.has(m.id)).slice(-150);
        if(nouveaux.length)lastMsg=Math.max(lastMsg,...nouveaux.map(m=>m.id));
        refreshPts();updateUnread();updateDefiBar();
        if(TAB==='chat')appendChat(nouveaux);
        else if(TAB==='defis'&&!DF&&!DJ&&!JOINING)renderDefis(true);
      }
    }catch(e){}
    polling=false;
  }
  pollT=setTimeout(poll,(TAB==='chat'||(TAB==='defis'&&!DF))?3000:8000);
}
function pollSoon(){clearTimeout(pollT);pollT=setTimeout(poll,150);}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){polling=false;pollSoon();}});
window.addEventListener('online',()=>{polling=false;pollSoon();});
window.addEventListener('focus',()=>pollSoon());

  const el=$('#defiBar');if(!el)return;const d=GS&&GS.defi;

  const c=GS.membres.find(m=>m.id===d.createur_id),qui=c?c.pseudo:"Quelqu'un";
  el.innerHTML=`<button class="btn full" style="background:linear-gradient(135deg,#6D4AFF,#E94BA8);box-shadow:0 6px 18px rgba(0,0,0,.18)" onclick="joinDefi('${d.id}')">⚡ ${d.etat==='attente'?esc(qui)+" t'attend pour un défi ! Rejoindre →":'Ton défi est en cours ! Y retourner →'}</button>`;
  el.style.display='';
}
function updateUnread(){
  const n=MSGS.filter(m=>m.id>seenMsg&&m.membre_id!==(G&&G.membre_id)&&!BLOQ.includes(m.membre_id)).length;

function markSeen(){if(lastMsg>seenMsg&&G){seenMsg=lastMsg;G.seen=seenMsg;saveGroups();}const u=$('#unread');if(u)u.style.display='none';}

async function doExclude(id){try{await call('exclure_membre',{p_cible:id});closeModal();toast('Membre retiré du groupe');pollSoon();}catch(e){toast(errMsg(e));}}

/* ===== DÉFI EN DIRECT ===== */
let DF=null; // {id,s,recv,key,timer,adv,lastPts}
const SHAPES=['▲','◆','●','■'];
function enterDefi(id){DF={id,s:null,recv:0,key:'',adv:false};TAB='defis';go('defis');defiLoop();}
async function defiLoop(){
  if(!DF)return;const me=DF;
  try{const s=await call('etat_defi',{p_defi:me.id});if(DF!==me)return;me.s=s;me.recv=performance.now();renderDefi();maybeAdvance();}
  catch(e){if(DF===me&&(e.code==='introuvable'||e.code==='defi_commence')){if(e.code==='defi_commence')toast(errMsg(e),4000);DF=null;pollSoon();render();return;}}
  if(DF===me){clearTimeout(me.loop);me.loop=setTimeout(defiLoop,me.s&&me.s.etat==='fini'?60000:1000);}
}
const elapsed=()=>DF&&DF.s?(DF.s.ecoule_ms+(performance.now()-DF.recv))/1000:0;
async function maybeAdvance(){
  const s=DF&&DF.s;if(!s||DF.adv)return;
  let ok=false;
  if(s.etat==='question')ok=elapsed()>s.duree+0.4||(s.joueurs.length>0&&s.joueurs.every(j=>j.a_repondu));
  else if(s.etat==='resultat')ok=elapsed()>6.4;
  if(!ok)return;
  DF.adv=true;const me=DF;
  try{await call('avancer_defi',{p_defi:s.id,p_etat:s.etat,p_idx:s.idx});}catch(e){}
  me.adv=false;if(DF===me){clearTimeout(me.loop);defiLoop();}
}
/* ===== DÉFIS DU JOUR (chacun à son rythme) ===== */
let DJL=null,DJLt=0,DJ=null;
async function loadDJL(force){
  if(!G||(!force&&Date.now()-DJLt<20000))return;DJLt=Date.now();
  try{const l=await call('defis_du_jour');const chg=JSON.stringify(l)!==JSON.stringify(DJL);DJL=l;if(chg&&TAB==='defis'&&!DF&&!DJ&&!JOINING)renderDefis(true);}catch(e){}
}
function djCard(){
  if(!DJL)return `<div class="card" style="margin-top:18px"><h2>☀️ Défis du jour</h2><p class="empty"><span class="dots"><span></span><span></span><span></span></span></p></div>`;
  if(!DJL.length)return `<div class="card" style="margin-top:18px"><h2>☀️ Défis du jour</h2><p class="meta" style="margin:0">Les défis du jour arrivent dès qu'il y a au moins 3 questions pour ton niveau.</p></div>`;
  return `<div class="card" style="margin-top:18px;background:linear-gradient(135deg,#6D4AFF,#E94BA8);border:none;color:#fff">
    <h2>☀️ Défis du jour</h2><p style="margin:0 0 12px;font-size:14px;opacity:.9">3 nouveaux défis chaque jour. Joue quand tu veux, à ton rythme !</p>
    ${DJL.map(d=>{const me=d.moi,rang=d.classement.findIndex(c=>c.id===G.membre_id)+1,fin=d.classement.filter(c=>c.fini).length;
      const st=!me||(!me.fini&&me.idx===0)?'À jouer':me.fini?`✅ ${me.bonnes}/${d.total} · ${me.score} pts${rang?` · ${rang}${rang===1?'re':'e'}`:''}`:`En cours : ${me.idx}/${d.total}`;
      return `<div style="background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px;margin:8px 0;display:flex;align-items:center;gap:10px">
        <div style="flex:1"><b>⚡ ${d.taille} questions</b><br><span style="font-size:13px;opacity:.9">${st}</span></div>
        <button class="mini" style="color:#fff;font-size:13px" onclick="djClassement('${d.id}')">🏆 ${fin}</button>
        ${me&&me.fini?'':`<button class="btn" style="background:#fff;color:#6D4AFF;min-height:40px;padding:8px 14px" onclick="openDJ('${d.id}')">${me&&me.idx>0?'Continuer':'Jouer'}</button>`}
      </div>`;}).join('')}
  </div>`;
}
function djClassement(id){

}
function renderFiche(){
  const f=FI.list.find(x=>x.id===FI.id);if(!f){FI.id=null;return renderReviser();}
  const fs=FI.list.filter(x=>x.matiere===f.matiere),k=fs.findIndex(x=>x.id===f.id),c=f.contenu||{},m=M(f.matiere);
  const ok=isApprise(f.id);
  $('#main').innerHTML=`<button class="mini" style="margin-top:14px" onclick="FI.id=null;renderReviser();window.scrollTo(0,0)">← ${m.e} ${esc(m.n)}</button>
  <div style="margin-top:8px">${tag(f.matiere)}<span class="meta">${esc(f.sujet)}</span></div>
  <h1 style="margin-top:8px">${esc(f.titre)}</h1>
  ${c.intro?`<p style="margin:6px 0 0">${nl2br(c.intro)}</p>`:''}
  ${(c.points&&c.points.length)?`<div class="card"><h2>📌 L'essentiel</h2><ul style="margin:0;padding-left:20px">${c.points.map(p=>`<li style="margin:6px 0">${nl2br(p)}</li>`).join('')}</ul></div>`:''}
  ${c.exemple?`<div class="banner sky"><div class="ic">💡</div><div><b>Exemple</b><br>${nl2br(c.exemple)}</div></div>`:''}
  ${c.retenir?`<div class="banner sun"><div class="ic">⭐</div><div><b>À retenir</b><br>${nl2br(c.retenir)}</div></div>`:''}
  ${c.astuce?`<div class="banner mint"><div class="ic">🧠</div><div><b>Astuce</b><br>${nl2br(c.astuce)}</div></div>`:''}
  <button class="btn ${ok?'mint':''} full" style="margin-top:6px" onclick="toggleApprise('${f.id}')">${ok?'✓ Fiche apprise':'Je l\'ai apprise ✓'}</button>
  <div class="row" style="margin-top:10px">${k>0?`<button class="btn light" onclick="FI.id='${fs[k-1].id}';renderReviser();window.scrollTo(0,0)">← Précédente</button>`:''}${k<fs.length-1?`<button class="btn light" onclick="FI.id='${fs[k+1].id}';renderReviser();window.scrollTo(0,0)">Suivante →</button>`:''}</div>`;
}
function toggleApprise(id){
  if(isApprise(id)){APPRISES=APPRISES.filter(x=>x!==id);}
  else{APPRISES.push(id);call('points_solo',{p_points:2}).then(pollSoon).catch(()=>{});toast('Bravo ! +2 ⭐');}
  LS.set('apprises',APPRISES);renderFiche();
}

/* ===== AGENDA (sur l'appareil) ===== */
let agM=null;
function renderAgenda(){
  const t=dayStr(),items=[...AG.items].sort((a,b)=>(a.fait-b.fait)||a.pour.localeCompare(b.pour));
  const todo=items.filter(i=>!i.fait),done=items.filter(i=>i.fait);
  $('#main').innerHTML=`<h1>Mon agenda 📒</h1>
  ${timerCard()}
  <div class="card"><h2>➕ Ajouter un devoir</h2>
    <div class="chips">${(G?MATS():MATIERES).map(m=>`<button class="chip ${agM===m.id?'on':''}" onclick="agKeep();agM='${m.id}';renderAgenda()">${m.e} ${m.n}</button>`).join('')}</div>
    <input type="text" id="agT" maxlength="160" placeholder="Ex. : exercices 3 et 4 page 52">
    ${agPhoto?`<div style="position:relative;margin-top:10px"><img src="${agPhoto}" alt="Photo du devoir" style="width:100%;max-height:220px;object-fit:cover;border-radius:12px;display:block"><button class="xb" style="position:absolute;top:8px;right:8px;background:rgba(255,255,255,.9);border-radius:999px;width:34px;height:34px" onclick="agKeep();agPhoto=null;renderAgenda()" aria-label="Retirer la photo">✕</button></div>`
      :`<button class="btn ghost full" style="margin-top:10px" onclick="agKeep();prendrePhoto()">📷 Prendre une photo du devoir</button>`}
    <label class="l">Pour le</label><input type="date" id="agD" value="${addDays(t,1)}" min="${t}">
    <button class="btn full" style="margin-top:12px" onclick="addDevoir()">Ajouter</button></div>
  <div class="card"><h2>À faire</h2>${todo.length?todo.map(taskHtml).join(''):'<p class="empty">Rien à faire 🎉</p>'}</div>
  ${done.length?`<div class="card"><h2>Fait ✅</h2>${done.slice(-15).map(taskHtml).join('')}</div>`:''}
  <p class="meta">📌 Ton agenda reste sur ton téléphone, personne d'autre ne le voit.</p>`;
  if(window._agT)$('#agT').value=window._agT;
  if(window._agD)$('#agD').value=window._agD;
}
function agKeep(){const a=$('#agT');if(a)window._agT=a.value;const d=$('#agD');if(d)window._agD=d.value;}
/* photos des devoirs : gardées sur le téléphone (IndexedDB) */
let agPhoto=null;
const PDB={db:null,async open(){if(this.db)return this.db;this.db=await new Promise((ok,ko)=>{const r=indexedDB.open('revizz_photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error);});return this.db;},
  async op(mode,fn){const db=await this.open();return new Promise((ok,ko)=>{const tx=db.transaction('p',mode),st=tx.objectStore('p');const r=fn(st);tx.oncomplete=()=>ok(r&&r.result);tx.onerror=()=>ko(tx.error);});},
  set(k,v){return this.op('readwrite',st=>st.put(v,k));},get(k){return this.op('readonly',st=>st.get(k));},del(k){return this.op('readwrite',st=>st.delete(k));}};
function prendrePhoto(){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('capture','environment');
  inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;try{agPhoto=await reduirePhoto(f);renderAgenda();}catch(e){toast("Impossible de lire cette photo");}};
  inp.click();
}
async function reduirePhoto(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=url;});
    const k=Math.min(1,1400/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.8);}
  finally{URL.revokeObjectURL(url);}
}
async function voirPhoto(id){
  let src=null;try{src=await PDB.get(id);}catch(e){}
  if(!src){toast('Photo introuvable sur ce téléphone');return;}
  const i=AG.items.find(x=>x.id===id);
  modal(`<h2>${i?esc(i.texte):'Photo du devoir'}</h2><img src="${src}" alt="Photo du devoir" style="width:100%;border-radius:12px;display:block">`);
}
function taskHtml(i){const late=!i.fait&&i.pour<dayStr();return `<div class="task ${i.fait?'done':''}"><button class="cb ${i.fait?'on':''}" onclick="toggleDevoir('${i.id}')">${i.fait?'✓':''}</button><div class="x"><div class="txt">${esc(i.texte)}</div>${i.photo?`<button class="mini" style="padding:2px 0" onclick="voirPhoto('${i.id}')">📷 Voir la photo</button>`:''}<div class="meta">${tag(i.matiere)}<span style="${late?'color:var(--coral);font-weight:600':''}">pour ${frDate(i.pour)}</span> · <button class="mini" style="color:var(--soft)" onclick="delDevoir('${i.id}')">supprimer</button></div></div></div>`;}
async function addDevoir(){
  const t=$('#agT').value.trim(),d=$('#agD').value;
  if(!agM){toast('Choisis la matière');return;}
  if(!t&&!agPhoto){toast('Écris le devoir ou prends-le en photo');return;}
  const id=uid(),item={id,matiere:agM,texte:t||'Devoir en photo 📷',pour:d||addDays(dayStr(),1),fait:false,photo:!!agPhoto};
  if(agPhoto){try{await PDB.set(id,agPhoto);}catch(e){toast("La photo n'a pas pu être enregistrée sur ce téléphone");item.photo=false;if(!t)return;}}
  AG.items.push(item);
  const enTrop=AG.items.length>200?AG.items.slice(0,AG.items.length-200):[];
  enTrop.forEach(x=>{if(x.photo)PDB.del(x.id).catch(()=>{});});
  AG.items=AG.items.slice(-200);LS.set('agenda',AG);agM=null;agPhoto=null;window._agT='';window._agD='';renderAgenda();toast('Devoir ajouté 👍');
}
function toggleDevoir(id){const i=AG.items.find(x=>x.id===id);if(i){i.fait=!i.fait;LS.set('agenda',AG);renderAgenda();}}
function delDevoir(id){const i=AG.items.find(x=>x.id===id);if(i&&i.photo)PDB.del(id).catch(()=>{});AG.items=AG.items.filter(x=>x.id!==id);LS.set('agenda',AG);renderAgenda();}
let TM={ph:'w',left:1200,run:false};
const fmt=s=>z(Math.floor(s/60))+':'+z(s%60);
function timerCard(){return `<div class="card center" style="background:${TM.ph==='w'?'var(--violet-l)':'var(--mint-l)'};border:none"><h2 style="margin:0">${TM.ph==='w'?'🎯 Concentration':'☕ Pause'}</h2><div class="tbig" id="tb">${fmt(TM.left)}</div><p class="meta" style="margin:0 0 12px">${TM.ph==='w'?'20 minutes de travail, sans distraction.':'5 minutes pour souffler.'}</p><div class="row"><button class="btn ${TM.run?'light':''}" onclick="tmToggle()">${TM.run?'⏸ Pause':'▶ Démarrer'}</button><button class="btn light" onclick="tmReset()">↺</button></div></div>`;}
function beep(){try{const a=window._ac||(window._ac=new (window.AudioContext||window.webkitAudioContext)());[0,.25,.5].forEach(d=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.2,a.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d+.2);o.start(a.currentTime+d);o.stop(a.currentTime+d+.22);});}catch(e){}}
function tmToggle(){try{window._ac=window._ac||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}if(TM.run){clearInterval(TM.iv);TM.run=false;}else{TM.run=true;TM.end=Date.now()+TM.left*1000;TM.iv=setInterval(tmTick,500);}if(TAB==='agenda')renderAgenda();}
function tmTick(){TM.left=Math.max(0,Math.round((TM.end-Date.now())/1000));if(!TM.left){beep();if(TM.ph==='w'){TM.ph='p';TM.left=300;toast('Bravo ! Place à la pause ☕',4000);}else{TM.ph='w';TM.left=1200;toast("C'est reparti 💪");}TM.end=Date.now()+TM.left*1000;if(TAB==='agenda')renderAgenda();}const b=$('#tb');if(b)b.textContent=fmt(TM.left);}
function tmReset(){clearInterval(TM.iv);TM={ph:'w',left:1200,run:false};if(TAB==='agenda')renderAgenda();}

/* ===== réglages ===== */
function modal(html){closeModal();const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML=`<div class="sheet"><button class="xb" onclick="closeModal()" aria-label="Fermer">✕</button>${html}</div>`;o.addEventListener('click',e=>{if(e.target===o)closeModal();});document.body.appendChild(o);}
function closeModal(){const o=$('#ov');o&&o.remove();}
function openSettings(){
  if(!P||!P.ok){modal(`<h2>Révizz</h2><p class="sub">Crée ton profil pour commencer.</p>`);return;}
  const admin=G&&GS&&GS.groupe.admin_id===G.membre_id;
  const bl=BLOQ.length;
  modal(`<h2>⚙️ Réglages</h2>
  <div class="card"><b>${esc(P.avatar)} ${esc(P.pseudo)}</b>${G?`<div class="meta">Groupe « ${esc(G.nom)} » ${admin?'· 👑 administrateur':''}</div>`:''}</div>
  ${installHtml()}
  ${GROUPS.length>1||G?`<button class="btn light full" style="margin-bottom:6px" onclick="openGroups()">👭 Mes groupes (${GROUPS.length}) · changer / ajouter</button>`:''}
  ${G?`<div class="card"><h2>👭 Groupe « ${esc(G.nom)} »</h2><div class="codebox">${esc(G.code)}</div>
    <button class="btn ghost full" onclick="openInvite()">📨 Inviter des amis</button>
    ${GS&&GS.groupe.niveau?`<p style="margin:10px 0 0">🎓 Niveau : <b>${NIV_LABEL[GS.groupe.niveau]}</b> <span class="meta">(définitif)</span></p>`:''}
    ${admin?`<button class="btn light full" style="margin-top:10px" onclick="newCode()">🔄 Changer le code du groupe</button><p class="meta" style="margin:6px 0 0">L'ancien code ne marchera plus. Les membres actuels restent dans le groupe.</p>`:''}
    ${bl?`<button class="btn light full" style="margin-top:10px" onclick="BLOQ=[];LS.set('bloques',[]);toast('Messages de nouveau visibles');closeModal()">Revoir les messages masqués (${bl} personne${bl>1?'s':''})</button>`:''}
    <button class="btn coral full" style="margin-top:10px" onclick="askLeave()">Quitter le groupe</button></div>`:''}
  <div class="card"><h2>👨‍👩‍👧 Pour les parents</h2><p style="margin:0;font-size:14px">Révizz ne demande ni e-mail ni nom de famille. Les messages passent par un filtre (insultes, numéros, adresses, réseaux sociaux, liens), peuvent être signalés et sont effacés après 30 jours. L'administrateur d'un groupe peut retirer un membre. Quitter le groupe efface le pseudo, les messages et les points de l'enfant.<br><br>En cas de harcèlement : <b>3020</b> (gratuit). Enfance en danger : <b>119</b> (gratuit, 24h/24).</p></div>
  ${GROUPS.length?`<button class="btn ghost full" style="margin-bottom:10px" onclick="openTransfert()">📱 Utiliser Révizz sur un autre téléphone</button>`:''}
  <button class="btn light full" onclick="resetProfil()">Changer de pseudo / d'avatar</button>`);
}
function choisirNiveauUneFois(){
  modal(`<h2>🎓 Niveau du groupe</h2><p class="sub">Choisis le niveau de ton groupe. <b>Attention : ce choix est définitif.</b> Il adapte les matières et le temps de réponse aux défis.</p>
  ${NIVEAUX.map(c=>`<div class="meta" style="margin-top:6px">${c.cycle}</div><div class="chips" style="margin:4px 0 6px">${c.l.map(n=>`<button class="chip" onclick="confirmerNiveau('${n}')">${NIV_LABEL[n]}</button>`).join('')}</div>`).join('')}`);
}
function confirmerNiveau(n){
  modal(`<h2>${NIV_LABEL[n]} ?</h2><p class="sub">Le niveau ne pourra plus être modifié ensuite.</p><div class="row"><button class="btn light" onclick="choisirNiveauUneFois()">Changer</button><button class="btn" onclick="validerNiveau('${n}')">Confirmer</button></div>`);
}
async function validerNiveau(n){try{await call('definir_niveau',{p_niveau:n});closeModal();toast('Niveau enregistré ✅');GS.groupe.niveau=n;G.niveau=n;saveGroups();render();}catch(e){toast(errMsg(e));closeModal();pollSoon();}}
/* ===== transfert vers un autre téléphone ===== */
let TRt=null;
async function openTransfert(){
  if(!GROUPS.length){toast('Rejoins d\'abord un groupe');return;}
  try{
    const r=await rpc('creer_transfert',{p_membres:GROUPS.map(g=>({membre_id:g.membre_id,token:g.token}))});
    const fin=Date.now()+r.expire_dans*1000;
    modal(`<h2>📱 Sur un autre téléphone</h2>
    <p class="sub">Sur le nouveau téléphone, ouvre Révizz et touche <b>« J'ai déjà Révizz sur un autre téléphone »</b>, puis tape ce code :</p>
    <div class="codebox" style="letter-spacing:4px">${esc(r.code)}</div>
    <p class="meta center" id="trLeft"></p>
    <p class="meta">Tu retrouveras ton pseudo, tes ${GROUPS.length} groupe${GROUPS.length>1?'s':''}, tes points et la discussion. Ce téléphone-ci reste connecté. L'agenda reste sur ce téléphone.</p>
    <div class="banner coral" style="font-size:14px"><div class="ic">🔒</div><div>Ne donne ce code à personne : il permet de jouer à ta place. Il ne marche qu'une seule fois.</div></div>`);
    clearInterval(TRt);TRt=setInterval(()=>{const el=$('#trLeft');if(!el){clearInterval(TRt);return;}const s=Math.max(0,Math.round((fin-Date.now())/1000));el.textContent=s?`Valable encore ${Math.floor(s/60)} min ${String(s%60).padStart(2,'0')} s`:'Code expiré : ferme et recommence.';},500);
  }catch(e){toast(errMsg(e));}
}
function openRecup(){
  modal(`<h2>📱 Récupérer mon compte</h2>
  <p class="sub">Sur ton <b>ancien</b> téléphone : ⚙️ Réglages → <b>« Utiliser Révizz sur un autre téléphone »</b>. Un code s'affiche : tape-le ici.</p>
  <input type="text" id="trCode" maxlength="9" placeholder="XXXX-XXXX" autocomplete="off" style="text-transform:uppercase;letter-spacing:4px;font-weight:700;font-size:20px;text-align:center">
  <button class="btn full" style="margin-top:12px" onclick="recupCompte()">Récupérer</button>`);
}
async function recupCompte(){
  const c=($('#trCode').value||'').trim();if(c.replace(/[^A-Za-z0-9]/g,'').length!==8){toast('Le code fait 8 caractères');return;}
  const token=newToken();
  try{
    const r=await rpc('utiliser_transfert',{p_code:c,p_token:token});
    if(r&&r.erreur)throw{code:r.erreur};
    const gs=r.groupes||[];if(!gs.length){toast('Aucun groupe à récupérer');return;}
    if(!P||!P.ok){P={pseudo:gs[0].pseudo,avatar:gs[0].avatar,ok:true};LS.set('profil',P);}
    let n=0;gs.forEach(g=>{if(!GROUPS.some(x=>x.groupe_id===g.groupe_id)&&GROUPS.length<MAX_GROUPES){GROUPS.push({membre_id:g.membre_id,token,groupe_id:g.groupe_id,code:g.code,nom:g.nom,niveau:g.niveau,seen:0});n++;}});
    G=GROUPS.find(x=>x.groupe_id===gs[0].groupe_id)||GROUPS[0];JOINING=false;saveGroups();resetGroupState();closeModal();
    toast(n?`C'est bon ! ${n} groupe${n>1?'s':''} récupéré${n>1?'s':''} 🎉`:'Tes groupes étaient déjà sur ce téléphone',4000);
    TAB='defis';go('defis');poll();
  }catch(e){toast(errMsg(e),4000);}
}
async function newCode(){try{const r=await call('changer_code');G.code=r.code;saveGroups();openSettings();toast('Nouveau code : '+r.code,4000);}catch(e){toast(errMsg(e));}}
function askLeave(){modal(`<h2>Quitter le groupe ?</h2><p class="sub">Ton pseudo, tes messages et tes points seront effacés. Tes questions restent dans la banque, sans ton nom. Tu pourras rejoindre un groupe plus tard.</p><div class="row"><button class="btn light" onclick="openSettings()">Annuler</button><button class="btn coral" onclick="doLeave()">Quitter</button></div>`);}
async function doLeave(){try{await call('quitter_groupe');}catch(e){}closeModal();leaveLocal();toast('Tu as quitté le groupe');}
function resetProfil(){if(GROUPS.length){toast("Quitte d'abord tes groupes pour changer de pseudo");return;}P=null;LS.set('profil',null);closeModal();render();}

/* ===== installation sur l'écran d'accueil ===== */
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;});
const standalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
function installHtml(){
  if(standalone())return '';
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  return `<div class="card"><h2>📲 Installer l'appli</h2>${installEvt?`<button class="btn full" onclick="doInstall()">Ajouter à l'écran d'accueil</button>`:
   ios?`<p style="margin:0;font-size:15px">Dans Safari, touche <b>Partager</b> ⬆️ puis <b>« Sur l'écran d'accueil »</b>.</p>`:
   `<p style="margin:0;font-size:15px">Dans Chrome, touche le menu <b>⋮</b> puis <b>« Installer l'application »</b> ou <b>« Ajouter à l'écran d'accueil »</b>.</p>`}</div>`;
}
async function doInstall(){if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice;}catch(e){}installEvt=null;closeModal();}
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* ===== démarrage ===== */
const invCode=new URLSearchParams(location.search).get('code');
if(invCode&&GROUPS.length){const g=GROUPS.find(x=>x.code===invCode.toUpperCase());if(g){G=g;saveGroups();history.replaceState(null,'',location.pathname);}else JOINING=true;}
go(TAB);if(G)poll();
</script>
